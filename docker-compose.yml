services:
  accessguard:
    build: .
    env_file: .env
    environment:
      ACCESSGUARD_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; put a reverse proxy in front to share it
    volumes:
      - accessguard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  accessguard-data:
