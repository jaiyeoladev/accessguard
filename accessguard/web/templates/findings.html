{% extends "base.html" %}
{% block title %}Findings{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Findings</h1>
    <p class="muted">{{ rows|length }} shown from scan #{{ state_obj.scan.id }} · {{ state_obj.scan.collected_at|dt }}</p>
  </div>
  <div class="actions">
    <a class="btn" href="/export/report.csv">Export CSV</a>
    <a class="btn" href="/export/report.json">Export JSON</a>
  </div>
</div>

<form class="filters" method="get" action="/findings">
  <label>Status
    <select name="state">
      <option value="all" {% if filters.state not in statuses %}selected{% endif %}>All</option>
      {% for key, label in statuses.items() %}
      <option value="{{ key }}" {% if filters.state == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Severity
    <select name="severity">
      <option value="">All</option>
      {% for s in severities %}<option value="{{ s }}" {% if filters.severity == s %}selected{% endif %}>{{ s|capitalize }}</option>{% endfor %}
    </select>
  </label>
  <label>Category
    <select name="category">
      <option value="">All</option>
      {% for c in categories %}<option value="{{ c }}" {% if filters.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label class="grow">Search
    <input type="search" name="q" value="{{ filters.q }}" placeholder="Name, rule ID or keyword">
  </label>
  <button class="btn btn-primary" type="submit">Apply</button>
</form>

<section class="panel flush">
  {% include "_findings_table.html" with context %}
</section>
{% endblock %}
